<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Sistema de Treinos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="pagina-autenticacao">
        <header>
            <p class="sobretitulo">SISTEMA DE TREINOS</p>
            <h1>Crie sua conta</h1>
            <p class="introducao">O cadastro cria uma conta de aluno.</p>
        </header>
        <p id="mensagem" role="status" aria-live="polite"></p>
        <section class="cartao-formulario">
            <form id="formularioCadastro">
                <label for="nome">Nome</label>
                <input type="text" id="nome" maxlength="100" autocomplete="name" required>
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" minlength="6" autocomplete="new-password" required>
                <label for="confirmacao">Confirme a senha</label>
                <input type="password" id="confirmacao" minlength="6" autocomplete="new-password" required>
                <button type="submit">Cadastrar</button>
            </form>
            <p class="texto-secundario">Já tem conta? <a href="index.html">Voltar para o login</a></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>
</body>
</html>
