<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha dos alunos | Sistema de Treinos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="pagina-protegida pagina-instrutor">
        <header class="cabecalho">
            <div>
                <p class="sobretitulo">SISTEMA DE TREINOS</p>
                <h1>Fichas de treino</h1>
                <p class="introducao">Olá, <span id="usuarioNome"></span>. Nível: <span id="usuarioNivel"></span>.</p>
            </div>
            <a class="link-pagina" id="linkAdministracao" href="admin.html" hidden>Gerenciar usuários</a>
            <button type="button" class="botao-secundario" id="btnSair">Sair</button>
        </header>
        <p id="mensagem" role="status" aria-live="polite"></p>
        <section class="painel-lista">
            <div class="barra-lista">
                <div><p class="sobretitulo">FICHAS</p><h2>Exercícios cadastrados</h2></div>
                <div class="filtro-aluno"><label for="filtroAluno">Mostrar ficha</label><select id="filtroAluno"><option value="">Todos os alunos</option></select></div>
            </div>
            <button type="button" id="btnBuscar">Buscar exercícios</button>
            <div class="tabela-rolagem">
                <table>
                    <thead><tr><th>Aluno</th><th>Exercício</th><th>Grupo muscular</th><th>Séries</th><th>Repetições</th><th>Carga (kg)</th><th>Ações</th></tr></thead>
                    <tbody id="listaExercicios"></tbody>
                </table>
            </div>
        </section>
        <section class="cartao-formulario" aria-labelledby="tituloFormulario">
            <p class="sobretitulo">FICHA DO ALUNO</p>
            <h2 id="tituloFormulario">Cadastrar exercício</h2>
            <form id="formularioExercicio">
                <label for="alunoId">Aluno</label>
                <select id="alunoId" required></select>
                <label for="nome">Nome do exercício</label>
                <input type="text" id="nome" maxlength="100" required>
                <label for="grupoMuscular">Grupo muscular</label>
                <input type="text" id="grupoMuscular" maxlength="50" required>
                <div class="campos-numericos">
                    <div><label for="series">Séries</label><input type="number" id="series" min="1" step="1" required></div>
                    <div><label for="repeticoes">Repetições</label><input type="number" id="repeticoes" min="1" step="1" required></div>
                </div>
                <label for="carga">Carga de referência (kg)</label>
                <input type="number" id="carga" min="0" step="0.5" value="0" required>
                <button type="submit" id="btnSalvar">Cadastrar</button>
                <button type="button" class="botao-secundario" id="btnCancelar" hidden>Cancelar</button>
            </form>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/instrutor.js"></script>
</body>
</html>
