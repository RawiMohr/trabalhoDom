<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treinos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <header class="cabecalho">
            <div>
                <p class="sobretitulo">MUSCULAÇÃO</p>
                <h1>Treinos</h1>
                <p class="introducao">Mantenha seus exercícios organizados.</p>
            </div>
            <button type="button" id="btnBuscar">Buscar exercícios</button>
        </header>

        <p id="mensagem" role="status" aria-live="polite"></p>

        <section class="painel-lista" aria-labelledby="tituloLista">
            <div class="barra-lista">
                <div>
                    <p class="sobretitulo">SEUS EXERCÍCIOS</p>
                    <h2 id="tituloLista">Exercícios cadastrados</h2>
                </div>
            </div>

            <div class="tabela-rolagem">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Grupo muscular</th>
                            <th>Séries</th>
                            <th>Repetições</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="listaExercicios"></tbody>
                </table>
            </div>
        </section>

        <section class="cartao-formulario" aria-labelledby="tituloFormulario">
            <p class="sobretitulo">NOVO REGISTRO</p>
            <h2 id="tituloFormulario">Cadastrar exercício</h2>
            <form id="formulario">
                <label for="nome">Nome do exercício</label>
                <input type="text" id="nome" maxlength="100" required>

                <label for="grupoMuscular">Grupo muscular</label>
                <input type="text" id="grupoMuscular" maxlength="50" required>

                <div class="campos-numericos">
                    <div>
                        <label for="series">Séries</label>
                        <input type="number" id="series" min="1" step="1" required>
                    </div>
                    <div>
                        <label for="repeticoes">Repetições</label>
                        <input type="number" id="repeticoes" min="1" step="1" required>
                    </div>
                </div>

                <button type="submit" id="btnSalvar">Cadastrar</button>
                <button type="button" id="btnCancelar" class="botao-cancelar" hidden>Cancelar</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
