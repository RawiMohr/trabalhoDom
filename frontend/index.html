<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar | Sistema de Treinos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="pagina-autenticacao">
        <header>
            <p class="sobretitulo">SISTEMA DE TREINOS</p>
            <h1>Entre na sua conta</h1>
            <p class="introducao">Consulte sua ficha e acompanhe seus treinos.</p>
        </header>
        <p id="mensagem" role="status" aria-live="polite"></p>
        <section class="cartao-formulario">
            <form id="formularioLogin">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>
                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>
                <button type="submit" id="btnEntrar">Entrar</button>
            </form>
            <p class="texto-secundario">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
        </section>
    </main>
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
